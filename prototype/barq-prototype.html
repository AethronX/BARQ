<title>BARQ نموذج تفاعلي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: centered phone frame on desktop, edge-to-edge on phones. Navy shell, amber used only for primary action and the lightning mark. */
:root{
  --navy:#0F172A; --navy-2:#1E293B; --accent:#F59E0B; --accent-ink:#1a1204;
  --bg:#EEF2F7; --screen:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --ok:#047857; --ok-bg:#D1FAE5; --warn:#92400E; --warn-bg:#FEF3C7; --info:#1D4ED8; --info-bg:#DBEAFE; --bad:#B91C1C; --bad-bg:#FEE2E2;
  --chip:#F1F5F9; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05080F; --screen:#0B1220; --card:#131C2E; --fg:#E8EEF7; --muted:#94A3B8; --line:#243148;
  --ok:#6EE7B7; --ok-bg:#064E3B; --warn:#FCD34D; --warn-bg:#451A03; --info:#93C5FD; --info-bg:#1E3A8A; --bad:#FCA5A5; --bad-bg:#7F1D1D;
  --chip:#1B2740; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05080F; --screen:#0B1220; --card:#131C2E; --fg:#E8EEF7; --muted:#94A3B8; --line:#243148;
  --ok:#6EE7B7; --ok-bg:#064E3B; --warn:#FCD34D; --warn-bg:#451A03; --info:#93C5FD; --info-bg:#1E3A8A; --bad:#FCA5A5; --bad-bg:#7F1D1D;
  --chip:#1B2740; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cap{max-width:430px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.cap b{color:var(--fg)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:4px 10px;border-radius:8px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.phone{flex:1;min-height:0;width:100%;max-width:430px;max-height:880px;background:var(--screen);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow)}
@media (max-width:480px){.phone{border-radius:20px}}
.mock{background:var(--warn-bg);color:var(--warn);font-size:11px;padding:4px 12px;text-align:center;font-weight:600}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:0}
.logo{font-family:'IBM Plex Sans',sans-serif;font-weight:700;letter-spacing:.14em;font-size:20px}
.logo i{color:var(--accent);font-style:normal}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.08)}
.ib svg{width:18px;height:18px}
[dir=ltr] .rtl-flip{transform:scaleX(-1)}
main{flex:1;overflow-y:auto;min-height:0;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;background:var(--navy);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:#94A3B8;font-size:11px;position:relative;min-height:48px}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-current="page"]{color:var(--accent)}
.dot{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero h2{margin:0;font-size:18px}
.hero p{margin:0;color:#CBD5E1;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;font-weight:600;width:100%}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{background:var(--navy);color:#fff}
.btn.g{background:var(--chip);color:var(--fg)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:start}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
h3{margin:0;font-size:15px}
.sec{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:12px}
.num{font-variant-numeric:tabular-nums;font-family:'IBM Plex Sans',sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--chip);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.link{color:var(--info);font-size:12px}
.item{cursor:pointer;text-align:start;width:100%}
label{font-weight:600;font-size:13px;display:block;margin-bottom:6px}
label i{color:var(--bad);font-style:normal}
.in{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.in.err{border-color:var(--bad)}
textarea.in{min-height:96px;resize:vertical}
.errt{color:var(--bad);font-size:12px;margin-top:4px}
.step{display:flex;gap:8px;align-items:stretch}
.step button{width:48px;border-radius:12px;background:var(--chip);font-size:20px}
.step input{text-align:center;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;min-height:36px}
.chipb[aria-pressed="true"]{background:var(--navy);color:#fff}
.price{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--chip);border-radius:10px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.score{display:grid;place-items:center;min-width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700}
.score small{font-size:9px;font-weight:500;color:#CBD5E1;display:block;line-height:1}
.fac{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.tl{display:flex;flex-direction:column;gap:0}
.tl div{display:flex;gap:10px;padding-bottom:12px;position:relative}
.tl div::before{content:"";position:absolute;inset-inline-start:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl div:last-child::before{display:none}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px;flex:none;z-index:1}
.tl .done i{background:var(--ok)}
.tl .cur i{background:var(--accent);box-shadow:0 0 0 4px rgba(245,158,11,.25)}
.tl .todo{color:var(--muted)}
.sheetbg{position:absolute;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:85%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:absolute;inset-inline:16px;bottom:76px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:12px;z-index:6;font-size:13px;display:flex;gap:8px;align-items:center}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;font-size:12px;min-width:340px}
.cmp th,.cmp td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.cmp th{color:var(--muted);font-weight:500}
.skel{height:76px;border-radius:14px;background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.note{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:12px}
</style>

</div>

const RFQ_FLOW={DRAFT:['PUBLISHED'],PUBLISHED:['OPEN'],OPEN:['QUOTES_RECEIVED','CANCELLED'],QUOTES_RECEIVED:['EVALUATION','CANCELLED'],EVALUATION:['AWARDED','CANCELLED'],AWARDED:['CLOSED'],CLOSED:[],CANCELLED:[]};
const ORDER_FLOW={PENDING:['CONFIRMED','CANCELLED'],CONFIRMED:['PROCESSING','CANCELLED'],PROCESSING:['READY_FOR_SHIPMENT'],READY_FOR_SHIPMENT:['SHIPPED'],SHIPPED:['DELIVERED'],DELIVERED:['COMPLETED'],COMPLETED:[],CANCELLED:[]};
const SHIP_ORDER=['CREATED','PICKED_UP','IN_TRANSIT','OUT_FOR_DELIVERY','DELIVERED'];
function transition(flow,from,to){if(!(flow[from]||[]).includes(to))throw new Error('Invalid transition '+from+' -> '+to);return to}
const W={price:.35,deliv:.20,rate:.15,ont:.15,ver:.10,term:.05};
function scoreAll(qs){
  const minP=Math.min(...qs.map(q=>q.unitB)),minD=Math.min(...qs.map(q=>q.days));
  return qs.map(q=>{
    const f={price:minP/q.unitB,deliv:minD/q.days,rate:q.rating/5,ont:q.ontime/100,ver:q.ver/3,term:q.termScore};
    const s=Object.keys(W).reduce((a,k)=>a+W[k]*f[k],0);
    return {...q,f,score:Math.round(s*100)};
  });
}

  const f=S.form,e={};
  if(f.prod.trim().length<3)e.prod=t('e_prod');
  const q=Number(f.qty);if(!Number.isInteger(q)||q<1||q>100000)e.qty=t('e_qty');
  if(f.spec.trim().length<10)e.spec=t('e_spec');
  if(!f.loc)e.loc=t('e_loc');
  if(!f.date||new Date(f.date)<=new Date(new Date().toDateString()))e.date=t('e_date');
  return e;
}
function genQuotes(rfqId,qty,seed){
  const base=baisa(430+(qty%7)*3);                  // mock unit price in baisa
  const raw=SUPPLIERS.map((s,i)=>({id:rfqId+'-'+s.id,supId:s.id,name:s.name,ver:s.ver,rating:s.rating,ontime:s.ontime,done:s.done,
    unitB:Math.round(base*s.mult/10)*10,days:s.days,warranty:s.warranty,terms:s.terms,termScore:s.termScore}));
  return scoreAll(raw.map(q=>({...q,totalB:q.unitB*qty})));
}
function submitRfq(){
  if(S.submitting)return;                      // double-tap guard
  S.errs=validate();
  if(Object.keys(S.errs).length){render();const first=document.querySelector('.in.err');if(first)first.focus();return}
  S.submitting=true;S.submitKey=S.submitKey||uid();render();
  const key=S.submitKey;
  setTimeout(()=>{
    if(S.rfqs.some(r=>r.key===key)){S.submitting=false;return}   // idempotent on same key
    const id=String(Math.floor(147+S.rfqs.length));
    const rfq={id,key,title:{ar:S.form.prod,en:S.form.prod},qty:Number(S.form.qty),unit:S.form.unit,n:0,hrs:'72h'};
    S.rfqs.unshift(rfq);S.rfqId=id;S.submitting=false;S.submitKey=null;S.loadingQ=true;S.loadFail=false;S.screen='rfq';S.tab='home';
    notify(t('n_rfq',{p:'#BARQ-2025-'+id}));toast(t('toast_rfq'));
    setTimeout(()=>{S.quotes[id]=genQuotes(id,rfq.qty);rfq.n=S.quotes[id].length;S.loadingQ=false;notify(t('n_new_quote',{p:'#BARQ-2025-'+id}));render()},1400);
  },900);
}
function openRfq(id){
  S.rfqId=id;S.screen='rfq';S.cmp=[];S.why=null;
  const r=curRfq();
  if(!S.quotes[id]){S.quotes[id]=genQuotes(id,r.qty);if(r.seed)r.n=S.quotes[id].length}
  render();
}
function confirmPick(){
  const sh=S.sheet;if(!sh||!sh.ok||sh.busy||S.order)return;sh.busy=true;render();
  setTimeout(()=>{
    if(S.order){S.sheet=null;render();return}      // never create two orders
    const q=sh.q;const r=curRfq();
    let st='PENDING';st=transition(ORDER_FLOW,st,'CONFIRMED');
    S.order={id:String(Date.now()).slice(-6),status:st,sup:q,totalB:q.totalB,loc:S.form.loc||'l_muscat',lg:null,ship:null};
    S.sheet=null;S.screen='orders';S.tab='orders';
    notify(t('n_selected',{s:nameOf(q)}));notify(t('n_order'));toast(t('toast_order'));render();
  },700);
}
function chooseLg(id){
  const o=S.order;if(!o||o.lg)return;
  const p=PROVIDERS.find(x=>x.id===id);
  o.lg=id;o.status=transition(ORDER_FLOW,transition(ORDER_FLOW,o.status,'PROCESSING'),'READY_FOR_SHIPMENT');
  o.ship={status:'CREATED',carrier:p?nameOf(p):t('lg_sup')};
  toast(t('toast_lg'));render();
}
function advance(){
  const o=S.order;if(!o||!o.ship)return;const i=SHIP_ORDER.indexOf(o.ship.status);if(i>=SHIP_ORDER.length-1)return;
  o.ship.status=SHIP_ORDER[i+1];
  if(o.ship.status==='PICKED_UP')o.status=transition(ORDER_FLOW,o.status,'SHIPPED');
  if(o.ship.status==='DELIVERED')o.status=transition(ORDER_FLOW,o.status,'DELIVERED');
  notify(t('n_ship',{x:t('ss.'+o.ship.status)}));render();
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||!$('#phone').contains(el)&&el.id!=='x')return;
  const a=el.dataset.act,id=el.dataset.id;
  if(el.type==='checkbox'&&a!=='cmp'&&a!=='cf-ok')return;
  switch(a){
   case'tab':S.tab=el.dataset.k;S.screen=S.tab;break;
   case'back':S.screen=S.screen==='new'||S.screen==='rfq'?'home':'home';S.tab='home';break;
   case'new-rfq':S.screen='new';S.errs={};break;
   case'qty+':S.form.qty=Math.min(100000,(Number(S.form.qty)||0)+1);break;
   case'qty-':S.form.qty=Math.max(1,(Number(S.form.qty)||2)-1);break;
   case'submit-rfq':return submitRfq();
   case'open-rfq':return openRfq(id);
   case'sort':S.sort=el.dataset.k;break;
   case'why':S.why=S.why===id?null:id;break;
   case'cmp':{
     if(el.checked){if(S.cmp.length>=3){el.checked=false;return toast(t('toast_max'))}S.cmp.push(id)}else S.cmp=S.cmp.filter(x=>x!==id);break}
   case'open-cmp':S.sheet={type:'cmp'};break;
   case'pick':{const q=(S.quotes[S.rfqId]||[]).find(x=>x.id===id);if(S.order){S.screen='orders';S.tab='orders';break}S.sheet={type:'confirm',q,ok:false};break}
   case'cf-ok':S.sheet.ok=el.checked;break;
   case'confirm':return confirmPick();
   case'sheet-close':S.sheet=null;break;
   case'sheet-bg':if(ev.target===el)S.sheet=null;else return;break;
   case'lg':return chooseLg(id);
   case'advance':return advance();
   case'retry':S.loadFail=false;break;
  }
  render();
});
document.addEventListener('input',ev=>{
  const f=ev.target.dataset&&ev.target.dataset.f;if(!f)return;
  S.form[f]=ev.target.value;if(S.errs[f]){delete S.errs[f]}
  if(f==='spec'){render()}
});
document.addEventListener('change',ev=>{const f=ev.target.dataset&&ev.target.dataset.f;if(f){S.form[f]=ev.target.value;if(S.errs[f])delete S.errs[f];render()}});
$('#l-ar').onclick=()=>{lang='ar';render()};
$('#l-en').onclick=()=>{lang='en';render()};
try{if(new URLSearchParams(location.search).get('lang')==='en')lang='en'}catch(_){}
render();
})();
</script>
