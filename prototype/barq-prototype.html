<title>BARQ نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: one iPhone-sized app screen, centered with a bezel on desktop and edge-to-edge (16px gutter) on phones.
   Palette taken from the BARQ mockups: deep navy chrome, amber for the primary action and the lightning motif,
   cool off-white ground, white cards. Deliberately single-theme (the brand look is fixed), every color set explicitly. */
:root{
  color-scheme:light;
  --navy:#0F172A; --navy-2:#14213D; --navy-3:#1E2F52; --navy-ink:#CBD5E1;
  --amber:#F8A91B; --amber-2:#F59E0B; --amber-soft:#FEF4DF; --amber-line:#F7C66A; --amber-ink:#1A1204;
  --bg:#F4F6FA; --card:#FFFFFF; --tile:#F5F7FB; --line:#E5EAF1;
  --ink:#0F172A; --ink-2:#334155; --muted:#7B8798;
  --green:#15803D; --green-soft:#E3F6EA; --blue:#2563EB; --blue-soft:#EAF1FD; --red:#C2410C; --red-soft:#FDEDE4;
  --page:#E6EBF2; --bezel:#0A0E18;
  --ar:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --num:'Poppins','IBM Plex Sans Arabic',system-ui,sans-serif;
  --brand:'Montserrat','Poppins',system-ui,sans-serif;
  --r-card:18px; --r-tile:14px; --r-btn:14px;
  --sh-card:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ar);font-size:14px;line-height:1.5;
  padding-inline:16px;padding-block:14px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
svg{display:block}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- page chrome (outside the phone) ---------- */
.deck{width:100%;max-width:760px;display:flex;flex-direction:column;gap:10px;align-items:center}
.deck-top{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:440px;flex-wrap:wrap}
.deck-title{font-weight:700;font-size:13px;color:var(--ink-2)}
.deck-title small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:5px 12px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.jump{display:flex;gap:6px;overflow-x:auto;max-width:440px;width:100%;padding-bottom:2px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.jump button[aria-current="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}

/* ---------- device ---------- */
.device{flex:1;min-height:0;width:100%;max-width:440px;max-height:900px;background:var(--bezel);border-radius:56px;padding:11px;
  box-shadow:0 0 0 1px #2B3245 inset,0 30px 60px -20px rgba(15,23,42,.45);display:flex}
.screen{container-type:inline-size;position:relative;flex:1;min-width:0;background:var(--bg);border-radius:45px;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding-inline:30px;color:#fff;background:var(--navy);direction:ltr;font-family:var(--num);font-weight:600;font-size:15px}
.sbar .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:#000;z-index:9}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:5px;background:#F1F5F9;opacity:.9;z-index:8;pointer-events:none}
@media (max-width:480px){
  body{padding-block:10px}
  .device{background:none;padding:0;border-radius:28px;box-shadow:0 20px 40px -24px rgba(15,23,42,.5);max-height:none}
  .screen{border-radius:28px}
  .sbar,.island,.homebar{display:none}
}

/* ---------- app header ---------- */
.hdr{flex:none;background:var(--navy);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:8px 16px 14px;position:relative;z-index:2}
.hdr .s{display:flex;align-items:center;gap:8px;justify-self:start;min-width:0}
.hdr .e{display:flex;align-items:center;gap:8px;justify-self:end}
.hdr h1{min-width:0;margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;position:relative;flex:none}
.hbtn:hover{background:rgba(255,255,255,.06)}
.hbtn svg{width:24px;height:24px}
.hbtn .bd{position:absolute;top:7px;inset-inline-end:7px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--navy)}
[dir=rtl] .flip{transform:scaleX(-1)}
[dir=ltr] .flipL{transform:scaleX(-1)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1;direction:ltr}
.logo .w{font-family:var(--brand);font-weight:800;font-size:27px;letter-spacing:.06em;display:flex;align-items:center}
.logo .w svg{width:27px;height:27px;margin-inline-start:1px}
.logo .t{font-family:var(--brand);font-weight:600;font-size:7.5px;letter-spacing:.32em;color:#E2E8F0;margin-top:4px;padding-left:.32em}

.hdr-t .logo .w{font-size:21px}.hdr-t .logo .w svg{width:21px;height:21px}.hdr-t .logo .t{font-size:6.5px}
/* ---------- body ---------- */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative}
.pad{padding:16px 14px 24px;display:flex;flex-direction:column;gap:14px}
.mock{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11px;font-weight:600;color:#92400E;background:var(--amber-soft);border-bottom:1px solid #F8E3B5;padding:5px 12px;flex:none}
.mock svg{width:13px;height:13px}
.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter,.skel,.pulse{animation:none!important}main{scroll-behavior:auto}}

/* ---------- home hero ---------- */
.hero{background:var(--navy);color:#fff;padding:6px 18px 74px;position:relative;overflow:hidden}
.hero .bolts{position:absolute;inset-inline-end:-30px;top:-10px;width:170px;height:200px;pointer-events:none;opacity:.9}
[dir=rtl] .hero .bolts{transform:scaleX(-1)}
.hero h2{margin:0;font-size:24px;font-weight:700;position:relative}
.hero h2 em{font-style:normal;color:var(--amber)}
.hero p{margin:4px 0 16px;color:var(--navy-ink);font-size:13.5px;position:relative}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;position:relative}
.kpi{background:rgba(255,255,255,.035);border:1px solid rgba(203,213,225,.22);border-radius:16px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;color:#fff;min-width:0}
.kpi .ci{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.kpi .ci svg{width:18px;height:18px}
.kpi b{font-family:var(--num);font-size:22px;font-weight:600;line-height:1.1}
.kpi span{font-size:11px;line-height:1.3;color:#E2E8F0}
.kpi small{font-size:9.5px;color:#94A3B8;direction:ltr}
.kpi .ch{width:14px;height:14px;color:#E2E8F0;margin-top:2px}
.sheet-up{background:var(--bg);margin-top:-56px;border-radius:24px 24px 0 0;position:relative}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 18px;border-radius:var(--r-btn);font-weight:700;font-size:15.5px;width:100%;transition:transform .08s,filter .15s;position:relative}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px;flex:none}
.btn.amber{background:linear-gradient(180deg,#FAB52E,var(--amber-2));color:var(--amber-ink);box-shadow:0 6px 16px -6px rgba(245,158,11,.6)}
.btn.navy{background:linear-gradient(180deg,var(--navy-3),var(--navy-2));color:#fff}
.btn.navy .bolt{color:var(--amber)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14.5px}
.btn .chev{position:absolute;inset-inline-end:14px;width:18px;height:18px;opacity:.9}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card)}
.panel{background:var(--card);border-radius:22px;box-shadow:var(--sh-card);border:1px solid var(--line);padding:14px 16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-h h3{margin:0;font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-h h3 svg{width:22px;height:22px;color:var(--amber)}
.lnk{color:var(--blue);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;min-height:36px}
.lnk svg{width:16px;height:16px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill svg{width:13px;height:13px}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.amber{background:var(--amber-soft);color:#9A5B00}
.pill.grey{background:var(--tile);color:var(--ink-2)}
.pill.red{background:var(--red-soft);color:var(--red)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 16px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--amber-soft);color:var(--amber-2);display:grid;place-items:center}
.empty .ei svg{width:30px;height:30px}
.empty b{color:var(--ink);font-size:16px}

/* ---------- RFQ list item ---------- */
.rfq{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:start;width:100%}
.rfq:last-child{border-bottom:0}
.thumb{width:78px;height:78px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden}
.thumb svg{width:100%;height:100%}
.rfq h4{margin:0;font-size:15.5px;font-weight:700}
.rfq .ref{font-family:var(--num);font-size:12.5px;color:var(--muted);direction:ltr;text-align:end;unicode-bidi:isolate}
[dir=ltr] .rfq .ref{text-align:start}
.rfq .sec{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.rfq .sec svg{width:14px;height:14px}
.cd{background:var(--amber-soft);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:112px}
.cd b{color:#D98A00;font-size:15px;font-weight:600;display:flex;gap:5px;align-items:center;white-space:nowrap}
.cd b .num{font-weight:600}.cd .dd2{font-family:var(--ar);font-size:13px}
.cd b svg{width:17px;height:17px}
.cd span{font-size:10.5px;color:var(--ink-2)}
.cd.closed{background:var(--tile)}
.cd.closed b{color:var(--muted)}
.qc{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:8px;justify-content:center}
.qc svg{width:16px;height:16px}
.rfq-side{display:flex;flex-direction:column;align-items:center}

/* ---------- activity ---------- */
.act{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.aci{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.aci svg{width:21px;height:21px}
.aci.green{background:var(--green-soft);color:#16A34A}
.aci.navy{background:#E8ECF4;color:var(--navy-3)}
.aci.amber{background:var(--amber-soft);color:var(--amber-2)}
.aci.blue{background:var(--blue-soft);color:var(--blue)}
.act p{margin:0;font-size:13.5px;font-weight:600}
.act small{font-size:11.5px;color:var(--muted)}
.act time{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ---------- form ---------- */
.fhead{display:flex;gap:14px;align-items:center}
.fhead .fi{width:60px;height:60px;border-radius:50%;background:var(--amber-soft);color:var(--amber-2);display:grid;place-items:center;flex:none}
.fhead .fi svg{width:28px;height:28px}
.fhead h2{margin:0;font-size:20px}
.fhead p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.fld label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.fld label i{color:#E11D48;font-style:normal;margin-inline-start:3px}
.inw{position:relative}
.inw > svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--ink-2);pointer-events:none}
.in{width:100%;min-height:56px;border:1.5px solid #D7DEE8;background:var(--card);border-radius:14px;padding:12px 16px;font-size:15px;transition:border-color .15s,box-shadow .15s;appearance:none;-webkit-appearance:none}
.inw .in{padding-inline-start:50px}
.in::placeholder{color:#94A3B8}
.in:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(248,169,27,.18)}
.in.err{border-color:#E11D48}
select.in{padding-inline-end:44px;cursor:pointer}
.inw .dd{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-2);pointer-events:none}
textarea.in{min-height:130px;resize:none;line-height:1.7}
.cnt{position:absolute;bottom:12px;inset-inline-end:16px;font-family:var(--num);font-size:12px;color:var(--muted)}
.errt{color:#E11D48;font-size:12.5px;margin-top:6px;display:flex;gap:5px;align-items:center}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px}
.qrow > *{min-width:0}
.step{display:flex;align-items:center;border:1.5px solid #D7DEE8;border-radius:14px;background:var(--card);min-height:56px;padding:0 8px}
.step button{width:40px;height:40px;border-radius:50%;background:#EEF2F7;display:grid;place-items:center;color:var(--ink-2);flex:none}
.step button svg{width:18px;height:18px}
.step input{flex:1;min-width:0;border:0;text-align:center;font-family:var(--num);font-size:20px;font-weight:500;background:none;outline:none}
.info{display:flex;gap:12px;align-items:center;background:#F0F5FD;border:1px solid #E0E9F7;border-radius:16px;padding:14px}
.info svg{width:28px;height:28px;color:var(--ink-2);flex:none}
.info b{display:block;font-size:14px}
.info span{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed #CBD5E1;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;background:var(--card);cursor:pointer;width:100%;text-align:start}
.drop svg{width:24px;height:24px;color:var(--ink-2);flex:none}
.drop b{display:block;font-size:13.5px}
.drop span{font-size:11.5px;color:var(--muted)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- RFQ summary (compare screen) ---------- */
.rsum{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.rsum .p{display:flex;gap:12px;align-items:center;min-width:0}
.rsum h2{margin:0;font-size:18px}
.rsum .ref{white-space:nowrap;font-family:var(--num);font-size:12.5px;color:var(--muted)}
.cntbox{background:#E9F0FB;border-radius:18px;padding:10px 16px;display:flex;align-items:center;gap:14px}
.cntbox span{font-size:12px;color:var(--ink-2);display:block}
.cntbox b{font-family:var(--num);font-size:24px;font-weight:600;line-height:1.1}
.cntbox svg{width:28px;height:28px;color:var(--ink-2)}

/* ---------- toolbar ---------- */
.tools{display:flex;gap:8px;align-items:stretch}
.segm{flex:1;display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;min-width:0}
.segm button{flex:1;min-height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;color:var(--ink);min-width:0;white-space:nowrap}
.segm button svg{width:18px;height:18px;flex:none}
.segm button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.fbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;min-height:50px;position:relative}
.fbtn svg{width:20px;height:20px}
.fbtn .bd{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.chip svg{width:19px;height:19px}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}

/* ---------- offer card ---------- */
.offer{container-type:inline-size;position:relative;padding:14px;overflow:hidden}
.offer.top{border:1.5px solid var(--amber);box-shadow:0 8px 24px -12px rgba(245,158,11,.45)}
.ribbon{position:absolute;top:0;inset-inline-start:0;background:linear-gradient(180deg,#FAB52E,var(--amber-2));color:var(--amber-ink);font-size:12px;font-weight:700;padding:5px 14px 5px 18px;display:flex;gap:5px;align-items:center;border-end-end-radius:14px}
.ribbon svg{width:14px;height:14px}
.og{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"tiles who" "cta who2";gap:12px 14px;align-items:start}
.offer.top .og{padding-top:20px}
.who{grid-area:who;display:flex;gap:10px;align-items:flex-start;min-width:0}
.who2{grid-area:who2;display:flex;flex-direction:column;gap:7px;align-self:end;padding-bottom:4px;min-width:0}
.tiles{grid-area:tiles;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cta{grid-area:cta}
@container (max-width:380px){
  .og{grid-template-columns:1fr;grid-template-areas:"who" "tiles" "who2" "cta"}
  .offer.top .og{padding-top:22px}
}
.logo-c{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--brand);font-weight:800;font-size:24px;background:#fff;border:1px solid var(--line);overflow:hidden}
.logo-c svg{width:100%;height:100%}
.nm{font-weight:700;font-size:15px;line-height:1.35;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.vt{width:17px;height:17px;color:var(--blue);flex:none}
.vtxt{font-size:12px;color:var(--muted)}
.stars{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stars .s{display:flex;gap:1px;color:var(--amber)}
.stars .s svg{width:14px;height:14px}
.stars b{font-family:var(--num);color:var(--ink);font-weight:600;font-size:13px}
.meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.meta svg{width:17px;height:17px;flex:none;color:var(--ink-2)}
.tile{background:var(--tile);border-radius:var(--r-tile);padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;min-height:92px;min-width:0}
.tile .lb{font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;line-height:1.3}
.tile .lb svg{width:16px;height:16px;color:var(--ink-2)}
.tile .v{font-weight:700;font-size:clamp(14px,4.6cqi,19px);display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.money{font-family:var(--num);font-weight:600;direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}
.money .c{font-size:.62em;font-weight:600;color:var(--ink-2)}
.money .d{font-size:.66em;color:var(--ink-2)}
.tile .pill{margin-top:3px;font-size:11px;padding:2px 8px}
.scr{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);min-height:32px}
.scr .sb{font-family:var(--num);background:var(--navy);color:#fff;border-radius:8px;padding:1px 7px;font-size:12px}
.scr u{text-decoration:none;color:var(--blue);font-weight:600}
.feat{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.feat span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.feat svg{width:16px;height:16px}

/* ---------- sticky summary ---------- */
.dock{position:sticky;bottom:0;padding:10px 12px;background:linear-gradient(180deg,rgba(244,246,250,0),var(--bg) 30%);z-index:3}
.dockin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.dockin .btn{width:auto;padding:0 20px}
.dstats{background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:6px 4px}
.dstats div{display:flex;align-items:center;gap:8px;padding:0 8px;min-width:0}
.dstats div+div{border-inline-start:1px solid var(--line)}
.dstats svg{width:22px;height:22px;color:var(--ink-2);flex:none}
.dstats span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.dstats b{font-size:13px;white-space:nowrap}

/* ---------- route card ---------- */
.banner{position:relative;background:var(--navy);color:#fff;padding:18px 18px 70px;overflow:hidden}
.banner svg.bg{position:absolute;inset:0;width:100%;height:100%}
.banner .bt{position:relative;display:flex;gap:12px;align-items:center}
.banner .bt .bi{width:46px;height:46px;color:var(--amber);flex:none}
.banner h2{margin:0;font-size:23px}
.banner p{margin:2px 0 0;font-size:13px;color:#E2E8F0}
.route{margin:-54px 14px 0;position:relative;padding:16px}
.rt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rt .pt{display:flex;gap:10px;align-items:center;min-width:0}
.rt .pt:last-child{justify-content:flex-end;text-align:end}
.rt small{font-size:11.5px;color:var(--muted);display:block}
.rt b{font-size:16px;display:block;line-height:1.3}
.rt .city{font-size:12.5px;color:var(--muted)}
.pin{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;box-shadow:var(--sh-card)}
.pin svg{width:22px;height:22px;color:var(--navy)}
.rt .mid{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-2);font-size:11.5px}
.rt .mid svg{width:24px;height:24px}
.attrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-top:12px}
.attrs div{display:flex;flex-direction:column;gap:3px;padding:0 8px;min-width:0}
.attrs div+div{border-inline-start:1px solid var(--line)}
.attrs small{font-size:10.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.attrs small svg{width:15px;height:15px;color:var(--ink-2);flex:none}
.attrs b{font-size:12.5px;line-height:1.35}
.flag{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #fff;box-shadow:var(--sh-card)}
.flag svg{width:100%;height:100%}
.dash{flex:1;border-top:2px dashed #CBD5E1;min-width:14px}
.note{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.note svg{width:16px;height:16px;flex:none}

/* ---------- order / tracking ---------- */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--tile);border-radius:12px;padding:10px 12px;min-width:0}
.kv small{display:block;font-size:11px;color:var(--muted)}
.kv b{font-size:13.5px}
.tl{display:flex;flex-direction:column}
.tl .st{display:grid;grid-template-columns:22px 1fr auto;gap:10px;position:relative;padding-bottom:16px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;inset-inline-start:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl .st:last-child::before{display:none}
.tl .st.done::before{background:#86EFAC}
.tl .dt{width:22px;height:22px;border-radius:50%;background:#E8ECF2;display:grid;place-items:center;z-index:1;color:#fff}
.tl .dt svg{width:13px;height:13px}
.tl .done .dt{background:#16A34A}
.tl .cur .dt{background:var(--amber);box-shadow:0 0 0 5px rgba(248,169,27,.22)}
.tl b{font-size:13.5px;font-weight:600}
.tl .todo b{color:var(--muted);font-weight:500}
.tl time{font-family:var(--num);font-size:11.5px;color:var(--muted)}
.prog{height:8px;border-radius:8px;background:#E8ECF2;overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-2));border-radius:8px;transition:width .4s}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;text-align:start;width:100%}
.opt .oi{width:46px;height:46px;border-radius:14px;background:var(--amber-soft);color:var(--amber-2);display:grid;place-items:center}
.opt .oi.n{background:#E8ECF4;color:var(--navy-3)}
.opt .oi svg{width:24px;height:24px}
.opt b{display:block;font-size:14.5px}
.opt span{font-size:12px;color:var(--muted)}
.opt .ch{width:20px;height:20px;color:var(--muted)}

/* ---------- tab bar ---------- */
.tabs{flex:none;background:var(--navy);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 26px;position:relative;z-index:4}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#E2E8F0;font-size:12px;font-weight:500;position:relative;min-height:52px;padding-top:4px}
.tabs button svg{width:25px;height:25px}
.tabs button .bd{position:absolute;top:2px;inset-inline-end:calc(50% - 16px);width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--navy)}
.tabs button[aria-current="page"]{color:var(--amber);font-weight:700}
.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:-6px;width:56px;height:3px;border-radius:3px;background:var(--amber)}
@media (max-width:480px){.tabs{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}

/* ---------- sheets / toast ---------- */
.scrim{position:absolute;inset:0;background:rgba(2,6,23,.5);display:flex;align-items:flex-end;z-index:20;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:10px 18px 30px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px)}}
.grab{width:42px;height:5px;border-radius:5px;background:#D5DCE6;align-self:center}
.sheet h3{margin:0;font-size:18px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;font-weight:500;cursor:pointer;background:var(--tile);border-radius:14px;padding:12px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--navy);margin:1px 0 0}
.fac{display:grid;grid-template-columns:76px 1fr 30px;gap:10px;align-items:center;font-size:12.5px}
.fac .bar{height:8px;border-radius:8px;background:#E8ECF2;overflow:hidden}
.fac .bar span{display:block;height:100%;background:var(--amber);border-radius:8px}
.fac .w{font-size:10.5px;color:var(--muted)}
.cmpw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.cmpw table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
.cmpw th,.cmpw td{padding:10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.cmpw tr:last-child td,.cmpw tr:last-child th{border-bottom:0}
.cmpw thead th{background:var(--tile);font-weight:700;color:var(--ink)}
.cmpw tbody th{color:var(--muted);font-weight:500;white-space:nowrap;position:sticky;inset-inline-start:0;background:var(--card)}
.cmpw .best{color:var(--green);font-weight:700}
.toast{position:absolute;inset-inline:16px;bottom:96px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;z-index:30;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px -10px rgba(2,6,23,.5);animation:up .2s ease-out}
.toast svg{width:18px;height:18px;color:var(--amber);flex:none}
.skel{border-radius:var(--r-card);background:linear-gradient(90deg,#E9EEF5 25%,#F5F7FB 50%,#E9EEF5 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;height:170px}
@keyframes sk{to{background-position:-200% 0}}
.pulse{animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.45}}
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:58px;height:58px;border-radius:18px;background:var(--navy);color:var(--amber);display:grid;place-items:center;font-family:var(--brand);font-weight:800;font-size:22px}
.list{display:flex;flex-direction:column}
.list > *{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:start;min-height:54px}
.list > *:last-child{border-bottom:0}
.list svg{width:22px;height:22px;color:var(--ink-2);flex:none}
.list .ch{width:18px;height:18px;color:var(--muted);margin-inline-start:auto}
@container (max-width:400px){
  .hdr-t{grid-template-columns:minmax(0,1fr) auto}

}

function move(flow,from,to){if(!(flow[from]||[]).includes(to))throw new Error('Invalid transition '+from+' -> '+to);return to}
const W={price:.35,speed:.20,rate:.15,ont:.15,ver:.10,terms:.05};
function score(qs){
  if(!qs.length)return qs;
  const minP=Math.min(...qs.map(q=>q.unitB)),minD=Math.min(...qs.map(q=>q.dMax));
  return qs.map(q=>{const f={price:minP/q.unitB,speed:minD/q.dMax,rate:q.rating/5,ont:q.ontime/100,ver:q.ver/3,terms:q.termScore};
    return {...q,f,score:Math.round(Object.keys(W).reduce((a,k)=>a+W[k]*f[k],0)*100)}});
}

function cdText(ms){
  if(ms<=0)return null;const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;

  if(!d)return hh;
  const dw=lang==='ar'&&d===2?'يومان':lang==='ar'&&d===1?'يوم':`<span class="num">${d}</span> ${dayWord(d)}`;
  return `<span class="dd2">${dw}</span>${hh}`;
}

  const by={score:(a,b)=>b.score-a.score,price:(a,b)=>a.totalB-b.totalB,fast:(a,b)=>a.dMax-b.dMax||a.dMin-b.dMin}[S.sort];

      <div><small>${t('warranty')}</small><b><span class="num">${q.warranty}</span> ${t('mo')}</b></div><div><small>${t('score_lbl')}</small><b class="num">${q.score}</b></div></div>
      <label class="chk"><input type="checkbox" id="cf-ok" data-a="cf-ok" ${s.ok?'checked':''}><span>${t('cf_chk')}</span></label>
      <div class="muted" style="font-size:12px;display:flex;gap:6px;align-items:center">${ic.shield.replace('<svg','<svg width="16" height="16"')}${t('cf_once')}</div>
      <button class="btn amber" data-a="confirm" ${s.ok&&!s.busy?'':'disabled'}>${s.busy?`<span class="pulse">${t('sending')}</span>`:`${ic.check}${t('cf_go')}`}</button>
      <button class="btn ghost sm" data-a="close">${t('cancel')}</button>`,t('cf_title'));
  }
  if(s.type==='del'){
    const p=PROV.find(x=>x.id===s.id);
    return wrap(`<h3>${t('cf_del')}</h3><div class="row">${logoC(p)}<div class="grow"><b>${esc(L(p.name))}</b><div class="muted" style="font-size:12px">${esc(L(p.tag))}</div></div></div>
      <div class="kv"><div><small>${t('total')}</small><b>${money(p.price)}</b></div><div><small>${t('dur')}</small><b>${t(p.eta)}</b></div></div>
      <div class="note">${ic.info}${t('demo_prov')}</div>
      <label class="chk"><input type="checkbox" data-a="cf-ok" ${s.ok?'checked':''}><span>${t('cf_del_chk')}</span></label>
      <button class="btn amber" data-a="confirm-del" ${s.ok?'':'disabled'}>${ic.check}${t('accept')}</button><button class="btn ghost sm" data-a="close">${t('cancel')}</button>`,t('cf_del'));
  }
  if(s.type==='score'){
    const q=(S.quotes[S.rfqId]||[]).find(x=>x.id===s.id);
    const fx=[['price','fx_price'],['speed','fx_speed'],['rate','fx_rate'],['ont','fx_ont'],['ver','fx_ver'],['terms','fx_terms']];
    return wrap(`<div class="row"><h3 class="grow">${t('sc_title')}</h3><span class="score-b num" style="background:var(--navy);color:#fff;border-radius:12px;padding:4px 12px;font-size:20px;font-weight:600">${q.score}</span></div>
      <b>${esc(L(q.name))}</b>
      ${fx.map(([k,l])=>`<div class="fac"><span>${t(l)} <span class="w num">${Math.round(W[k]*100)}%</span></span><div class="bar"><span style="width:${Math.round(q.f[k]*100)}%"></span></div><span class="num">${Math.round(q.f[k]*100)}</span></div>`).join('')}
      <div class="note">${ic.info}${t('sc_formula')}</div><button class="btn ghost sm" data-a="close">${t('close')}</button>`,t('sc_title'));
  }
  if(s.type==='filter'){
    const d=s.draft;
    return wrap(`<h3>${t('filter')}</h3>
      <label class="chk"><input type="checkbox" data-a="fv" ${d.ver?'checked':''}><span>${t('f_verified')}</span></label>
      <div><b style="font-size:13.5px">${t('f_maxdays')}</b><div class="chips" style="margin-top:8px">${[0,7,10].map(v=>`<button class="chip" data-a="fmax" data-v="${v}" aria-pressed="${d.max===v}">${v?t('within',{d:v}):t('any')}</button>`).join('')}</div></div>
      <button class="btn amber" data-a="apply-f">${t('apply')}</button><button class="btn ghost sm" data-a="close">${t('cancel')}</button>`,t('filter'));
  }
  if(s.type==='compare'){
    const all=S.quotes[S.rfqId]||[];const list=filtered().length?filtered():all;
    const best={total:Math.min(...list.map(q=>q.totalB)),d:Math.min(...list.map(q=>q.dMax)),score:Math.max(...list.map(q=>q.score)),r:Math.max(...list.map(q=>q.rating)),o:Math.max(...list.map(q=>q.ontime)),w:Math.max(...list.map(q=>q.warranty))};
    const rows=[[t('score_lbl'),q=>`<span class="num ${q.score===best.score?'best':''}">${q.score}</span>`],[t('total'),q=>`<span class="${q.totalB===best.total?'best':''}">${money(q.totalB)}</span>`],[t('unit'),q=>money(q.unitB)],
      [t('eta'),q=>`<span class="${q.dMax===best.d?'best':''}">${rangeDays(q.dMin,q.dMax)}</span>`],[t('rating'),q=>`<span class="num ${q.rating===best.r?'best':''}">★ ${q.rating.toFixed(1)}</span>`],
      [t('ontime'),q=>`<span class="num ${q.ontime===best.o?'best':''}">${q.ontime}%</span>`],[t('warranty'),q=>`<span class="${q.warranty===best.w?'best':''}"><span class="num">${q.warranty}</span> ${t('mo')}</span>`],
      [t('terms'),q=>esc(L(q.terms))],[t('verification'),q=>verPill(q.ver)]];
    return wrap(`<h3>${t('compare')}</h3><div class="cmpw"><table><thead><tr><th></th>${list.map(q=>`<th>${esc(L(q.name))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><th>${r[0]}</th>${list.map(q=>`<td>${r[1](q)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="note">${ic.info}${t('no_auto')}</div><button class="btn ghost sm" data-a="close">${t('close')}</button>`,t('compare'));
  }
  return '';
}

/* =====================================================================
   Render
   ===================================================================== */
const VIEWS={home:vHome,rfqs:vRfqs,new:vNew,quotes:vQuotes,orders:vOrders,local:vLocal,intl:vIntl,track:vTrack,alerts:vAlerts,more:vMore};
let lastScreen=null;
function render(){
  const m=$('#m');if(m&&lastScreen)S.scroll[lastScreen]=m.scrollTop;
  const ae=document.activeElement,fid=ae&&ae.id&&$('#app').contains(ae)?ae.id:null,sel=fid&&ae.selectionStart!=null?ae.selectionStart:null;
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#app').innerHTML=`<div class="sbar"><span>9:41</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.3-2.6a3.3 3.3 0 00-4.6 0zM3.4 6.6a6.6 6.6 0 019.2 0l1.6-1.8a9 9 0 00-12.4 0zM.1 3a11 11 0 0115.8 0" fill="#fff"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#fff" opacity=".5" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="#fff"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#fff" opacity=".5"/></svg></span></div><span class="island"></span>`
    +VIEWS[S.screen]()+vSheet()+(S.toast?`<div class="toast" role="status">${ic.bolt}${esc(t(S.toast))}</div>`:'')+'<span class="homebar"></span>';
  const nm=$('#m');if(nm){nm.style.scrollBehavior='auto';nm.scrollTop=lastScreen===S.screen?(S.scroll[S.screen]||0):0;nm.style.scrollBehavior=''}
  lastScreen=S.screen;
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(_){}}}
  $('#dk-t').innerHTML=`${t('deck')}<small>${t('deck_s')}</small>`;
  $('#l-ar').setAttribute('aria-pressed',lang==='ar');$('#l-en').setAttribute('aria-pressed',lang==='en');
  const J=[['home','j_home'],['new','j_new'],['quotes','j_quotes'],['local','j_local'],['intl','j_intl'],['track','j_track']];
  $('#jump').innerHTML=J.map(([k,l])=>`<button data-j="${k}" aria-current="${S.screen===k}">${t(l)}</button>`).join('');
}
function go(screen){
  if(screen==='track'&&!(S.order&&S.order.ship))ensureDemoOrder(true);
  S.screen=screen;S.sheet=null;
  if(['home','rfqs','orders','alerts','more'].includes(screen))S.tab=screen;
  if(screen==='alerts')S.unread=0;
  render();
}
function back(){
  const map={new:'home',quotes:S.tab==='rfqs'?'rfqs':'home',local:S.order?'orders':'home',intl:S.order?'orders':'more',track:'orders'};
  go(map[S.screen]||'home');
}

/* =====================================================================
   Actions
   ===================================================================== */
function validate(){
  const f=S.form,e={};
  if(f.prod.trim().length<3)e.prod=t('e_prod');
  const q=Number(f.qty);if(!Number.isInteger(q)||q<1||q>100000)e.qty=t('e_qty');
  if(f.spec.trim().length<10)e.spec=t('e_spec');
  if(!f.loc)e.loc=t('e_loc');
  if(!f.date||new Date(f.date+'T00:00')<=new Date(new Date().toDateString()))e.date=t('e_date');
  return e;
}
const sent=new Set();   // idempotency keys already accepted by the (mock) server
function submitRfq(){
  if(S.busy)return;
  S.errs=validate();
  if(Object.keys(S.errs).length){render();const el=document.querySelector('.err,[aria-invalid]');if(el)el.focus();return}
  S.busy=true;S.idem=S.idem||('rfq-'+Math.random().toString(36).slice(2));render();
  const key=S.idem;
  setTimeout(()=>{
    S.busy=false;
    if(sent.has(key))return;sent.add(key);S.idem=null;
    const id=String(148+S.rfqs.length-3).padStart(4,'0');
    const r={id,title:{ar:S.form.prod.trim(),en:S.form.prod.trim()},cat:S.form.cat,sector:{ar:T.ar[S.form.cat],en:T.en[S.form.cat]},qty:Number(S.form.qty),unit:S.form.unit,closes:Date.now()+72*H};
    S.rfqs.unshift(r);S.quotes[id]=[];S.arrive[id]=true;S.rfqId=id;S.sort='score';S.flt={ver:false,max:0};
    pushN('rfq',()=>t('n_pub',{p:'#BARQ-2025-'+id}),()=>L(r.title));
    S.screen='quotes';S.toast='toast_sent';render();setTimeout(()=>{S.toast=null;render()},2400);
    const all=genQuotes(r);let i=0;
    const tick=()=>{if(i>=all.length){S.arrive[id]=false;render();return}
      const next=score([...S.quotes[id].map(({f,score,...q})=>q),(({f,score,...q})=>q)(all[i])]);S.quotes[id]=next;
      const s=all[i];pushN('quote',()=>t('n_quote',{s:L(s.name)}),()=>'RFQ #BARQ-2025-'+id);i++;render();setTimeout(tick,900)};
    setTimeout(tick,1100);
  },900);
}
function ensureDemoOrder(withShip){
  if(!S.order){
    const q=[...S.quotes['0147']].sort((a,b)=>b.score-a.score)[0];createOrder(q,'0147',true);
  }
  if(withShip&&!S.order.ship){const p=PROV[0];setDelivery(L(p.name),t(p.eta),true)}
}
function stamp(){return new Date().toLocaleString(lang==='ar'?'ar-OM-u-nu-latn':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function createOrder(q,rfqId,silent){
  if(S.order)return;   // a buyer can award once per prototype session; never two orders
  let st=move(ORDER_FLOW,'PENDING','CONFIRMED');
  S.order={id:String(Date.now()).slice(-6),rfq:rfqId,q,status:st,times:{CONFIRMED:stamp()},del:null,ship:null};
  if(!silent){pushN('check',()=>t('n_sel',{s:L(q.name)}),()=>'RFQ #BARQ-2025-'+rfqId);pushN('order',()=>t('n_order',{o:'ORD-'+S.order.id}),()=>moneyTxt(q.totalB))}
}
function setDelivery(name,eta,silent){
  const o=S.order;if(!o||o.del)return;
  o.status=move(ORDER_FLOW,o.status,'PROCESSING');o.times.PROCESSING=stamp();
  o.status=move(ORDER_FLOW,o.status,'READY_FOR_SHIPMENT');o.times.READY_FOR_SHIPMENT=stamp();
  o.del={name,eta};o.ship={status:'CREATED',times:{CREATED:stamp()}};
  if(!silent)pushN('ship',()=>t('n_deliv',{c:name}),()=>'ORD-'+o.id);
}
function advance(){
  const o=S.order;if(!o||!o.ship)return;const i=SHIP_STEPS.indexOf(o.ship.status);if(i>=SHIP_STEPS.length-1)return;
  const ns=SHIP_STEPS[i+1];o.ship.status=ns;o.ship.times[ns]=stamp();
  if(ns==='PICKED_UP'){o.status=move(ORDER_FLOW,o.status,'SHIPPED');o.times.SHIPPED=stamp()}
  if(ns==='DELIVERED'){o.status=move(ORDER_FLOW,o.status,'DELIVERED');o.times.DELIVERED=stamp()}
  pushN('ship',()=>t('n_ship',{x:t('ss_'+ns)}),()=>'SHP-'+o.id);render();
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const j=ev.target.closest('[data-j]');if(j){const k=j.dataset.j;if(k==='quotes')S.rfqId='0147';go(k);return}
  const el=ev.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,s=S.sheet;
  switch(a){
    case'tab':case'nav':return go(el.dataset.s);
    case'back':return back();
    case'open-rfq':S.rfqId=id;S.sort='score';S.flt={ver:false,max:0};return go('quotes');
    case'qty':{const v=Math.min(100000,Math.max(1,(parseInt(S.form.qty,10)||0)+Number(el.dataset.d)));S.form.qty=v;delete S.errs.qty;break}
    case'sort':S.sort=el.dataset.k;break;
    case'dsort':S.dsort=el.dataset.k;break;
    case'filter':S.sheet={type:'filter',draft:{...S.flt}};break;
    case'fv':if(s)s.draft.ver=el.checked;return;
    case'fmax':s.draft.max=Number(el.dataset.v);break;
    case'apply-f':S.flt={...s.draft};S.sheet=null;break;
    case'clear-f':S.flt={ver:false,max:0};break;
    case'score':S.sheet={type:'score',id};break;
    case'compare':S.sheet={type:'compare'};break;
    case'accept':{
      if(S.order){toast('toast_order');return go('orders')}
      const q=(S.quotes[S.rfqId]||[]).find(x=>x.id===id);S.sheet={type:'accept',q,ok:false};break}
    case'cf-ok':if(s){s.ok=el.checked;const b=document.querySelector('[data-a="confirm"],[data-a="confirm-del"]');if(b)b.disabled=!s.ok}return;
    case'confirm':{
      if(!s||!s.ok||s.busy)return;s.busy=true;render();
      setTimeout(()=>{createOrder(s.q,S.rfqId);S.sheet=null;S.toast=null;go('orders');toast('toast_order')},700);return}
    case'sup-del':setDelivery(t('opt_sup')+' · '+L(S.order.q.name),`${S.order.q.dMin} - ${S.order.q.dMax} ${t('dN')}`);toast('toast_del');return;
    case'nav-local':return go('local');
    case'nav-intl':return go('intl');
    case'pick-del':if(!S.order){ensureDemoOrder(false)}S.sheet={type:'del',id,ok:false};break;
    case'confirm-del':{if(!s||!s.ok)return;const p=PROV.find(x=>x.id===s.id);setDelivery(L(p.name),t(p.eta));S.sheet=null;go('track');toast('toast_del');return}
    case'advance':return advance();
    case'close':S.sheet=null;break;
    case'scrim':if(ev.target!==el)return;S.sheet=null;break;
    case'lang':lang=el.dataset.l;break;
    default:return;
  }
  render();
});
document.addEventListener('submit',ev=>{if(ev.target.id==='rfqf'){ev.preventDefault();submitRfq()}});
document.addEventListener('input',ev=>{
  const f=ev.target.dataset&&ev.target.dataset.f;if(!f)return;
  S.form[f]=ev.target.value;
  if(S.errs[f]){delete S.errs[f];ev.target.classList.remove('err');ev.target.removeAttribute('aria-invalid');const e=ev.target.closest('.fld')&&ev.target.closest('.fld').querySelector('.errt');if(e)e.remove()}
  if(f==='spec'){const c=$('#cnt');if(c)c.textContent=ev.target.value.length+'/1000'}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='f-file'){
    const ok=/\.(pdf|png|jpe?g|xlsx?|csv)$/i,files=[...ev.target.files];
    const bad=files.some(x=>!ok.test(x.name)||x.size>10*1024*1024);
    if(bad)S.errs.file=t('e_file');else{delete S.errs.file;S.form.files=files.map(x=>x.name.replace(/[^\w.\-؀-ۿ ]/g,'_').slice(0,60))}
    render();return}
  const f=ev.target.dataset&&ev.target.dataset.f;if(f&&ev.target.tagName==='SELECT'){S.form[f]=ev.target.value;delete S.errs[f];render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){S.sheet=null;render()}});
$('#l-ar').onclick=()=>{lang='ar';render()};
$('#l-en').onclick=()=>{lang='en';render()};

/* live countdowns: update text only, never re-render (keeps focus and scroll) */
setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(el=>{const v=cdText(Number(el.dataset.cd)-Date.now());el.innerHTML=v||t('closed')})},1000);

render();
})();
</script>
